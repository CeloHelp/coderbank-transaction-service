server:
  port: 8082

spring:
  datasource:
    # Corrigido para apontar para o banco correto de transações
    url: jdbc:postgresql://localhost:5434/transaction_db
    username: postgres
    password: root
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.format_sql: true
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    url: jdbc:postgresql://127.0.0.1:5434/transaction_db
    user: postgres
    password: root

management:
  endpoints.web.exposure.include: health,info

logging:
  level:
    root: INFO

    com.coderbank.transaction: DEBUG
  pattern:
    console: >
      {"ts":"%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}","level":"%p",
       "logger":"%c{1}","msg":"%m","thread":"%t"}%n

